# Example protocol.yaml for devctl (protocol.yml also supported)
# Place this file in the ROOT of the repo you want to sync from.
# Then run: devctl ai-kit setup --repo <your-repo-url>
# Optional: devctl ai-kit setup --repo <url> --branch <branch>
#
# Repo URL can be HTTPS (https://github.com/org/repo) or SSH (git@github.com:org/repo.git)

version: v1

protocols:
  # file_sync: copy/merge files from repo into a local target
  - name: cursor
    type: file_sync
    source: .cursor
    target: ~/.cursor
    obligations:
      - rules/security.json
    recommendations:
      - skills/debugging.md

  # script_run: execute shell from the cloned repo root (cwd = repo root)
  - name: python-deps
    type: script_run
    script: |
      set -euo pipefail
      VENV_DIR="$HOME/.wi_venv"
      REPO_DIR="$(pwd)"

      if [[ ! -d "$VENV_DIR" ]]; then
        python3 -m venv "$VENV_DIR"
      fi

      "$VENV_DIR/bin/pip" install -U pip
      "$VENV_DIR/bin/pip" install -r "$REPO_DIR/requirements.txt"
